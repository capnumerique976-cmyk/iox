# ─────────────────────────────────────────────────────────────
#  IOX — Nginx reverse proxy pilote
#  Placer dans /etc/nginx/sites-available/iox-pilot
#  puis : ln -s /etc/nginx/sites-available/iox-pilot /etc/nginx/sites-enabled/
#  SSL : certbot --nginx -d iox.mycloud.yt
# ─────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name iox.mycloud.yt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iox.mycloud.yt;

    # ── SSL (géré par certbot — ne pas modifier manuellement) ─
    ssl_certificate     /etc/letsencrypt/live/iox.mycloud.yt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iox.mycloud.yt/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Headers sécurité ─────────────────────────────────────
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Upload limite (images 5Mo + vidéos 50Mo + overhead) ──
    client_max_body_size 60m;

    # ── Logs ─────────────────────────────────────────────────
    access_log /var/log/nginx/iox-pilot.access.log;
    error_log  /var/log/nginx/iox-pilot.error.log warn;

    # ── API Backend NestJS ────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Swagger UI (accès restreint en prod recommandé) ───────
    location /api-docs {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Optionnel : restreindre à une IP admin
        # allow 1.2.3.4;
        # deny all;
    }

    # ── Frontend Next.js ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Assets Next.js (cache agressif) ──────────────────────
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
